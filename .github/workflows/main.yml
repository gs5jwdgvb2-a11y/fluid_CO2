<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактивная модель термоэлектрического контура CO2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Segoe UI', Arial, sans-serif; background:#f4f6f8; color:#222; }
  header { background:#002B49; color:#fff; padding:14px 24px; }
  header h1 { margin:0; font-size:19px; font-weight:600; }
  .wrap { display:flex; gap:18px; padding:18px; align-items:flex-start; flex-wrap:wrap; }
  .panel { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.12); padding:18px; }
  .controls { flex:1 1 320px; min-width:300px; }
  .plot { flex:2 1 520px; min-width:340px; }
  .ctrl { margin-bottom:18px; }
  .ctrl label b { display:block; margin-bottom:4px; font-size:14px; }
  .ctrl .val { color:#002B49; font-weight:700; }
  input[type=range] { width:100%; }
  .report { margin-top:6px; font-size:14px; line-height:1.55; background:#f8fafc;
            border:1px solid #dfe6ee; border-radius:8px; padding:12px; }
  .report b { color:#002B49; }
  .canvasbox { position:relative; height:420px; }
</style>
</head>
<body>
<header><h1>Интерактивная модель термоэлектрического контура CO2</h1></header>
<div class="wrap">
  <div class="panel controls">
    <div class="ctrl">
      <label><b>Расход углекислоты, м³/ч: <span class="val" id="lbl_flow">0.7</span></b></label>
      <input type="range" id="sld_flow" min="1" max="20" value="7">
    </div>
    <div class="ctrl">
      <label><b>Внутренний диаметр трубы, мм: <span class="val" id="lbl_diam">20</span></b></label>
      <input type="range" id="sld_diam" min="10" max="50" value="20">
    </div>
    <div class="ctrl">
      <label><b>Рабочий ток элементов, А: <span class="val" id="lbl_current">4.0</span></b></label>
      <input type="range" id="sld_current" min="10" max="90" value="40">
    </div>
    <div class="ctrl">
      <label><b>Количество модулей Пельтье, шт: <span class="val" id="lbl_num">140</span></b></label>
      <input type="range" id="sld_num" min="20" max="250" value="140">
    </div>
    <div class="report" id="report"></div>
  </div>
  <div class="panel plot">
    <div class="canvasbox"><canvas id="chart"></canvas></div>
  </div>
</div>
<script>
const A = 0.055, R_MOD = 1.2, K_MOD = 0.5, R_TH = 0.002,
      RHO = 791.0, MU = 6e-5, T_C = 5.0, T_H = 35.0;

function solveTemp(I, iterations) {
  let Tc = T_C + 273.15, Th = T_H + 273.15, qc = 0, qh = 0;
  for (let k = 0; k < iterations; k++) {
    qc = A * I * Tc - 0.5 * I * I * R_MOD - K_MOD * (Th - Tc);
    qh = A * I * Th + 0.5 * I * I * R_MOD - K_MOD * (Th - Tc);
    Tc = (T_C + 273.15) - qc * R_TH;
    Th = (T_H + 273.15) + qh * R_TH;
  }
  return { qc, qh, Tc, Th };
}

let chart = null;
function updateModel() {
  const flow = document.getElementById('sld_flow').value / 10.0;
  const dMM  = +document.getElementById('sld_diam').value;
  const I    = document.getElementById('sld_current').value / 10.0;
  const N    = +document.getElementById('sld_num').value;

  document.getElementById('lbl_flow').textContent = flow.toFixed(1);
  document.getElementById('lbl_diam').textContent = dMM;
  document.getElementById('lbl_current').textContent = I.toFixed(1);
  document.getElementById('lbl_num').textContent = N;

  const G = (flow * RHO) / 3600.0;
  const d = dMM / 1000.0;
  const area = Math.PI * d * d / 4.0;
  const v = G / (RHO * area);
  const Re = RHO * v * d / MU;
  const lam = Re > 4000 ? 0.3164 / Math.pow(Re, 0.25) : 64.0 / Re;
  const L = (N * 0.04) / 3.0;
  const dP = lam * (L / d) * (RHO * v * v / 2.0);

  const QcoldReq = G * 34000, QhotReq = G * 110000;
  const s = solveTemp(I, 50);
  const Qc = s.qc * N, Qh = s.qh * N, P = (s.qh - s.qc) * N;
  const COP = P > 0 ? Qc / P : 0;
  const Qdop = QhotReq - Qh;

  document.getElementById('report').innerHTML =
    '<b>ИНЖЕНЕРНЫЙ ОТЧЕТ (Установившийся режим):</b><br>' +
    '&bull; Холод модулей: <b>' + (Qc/1000).toFixed(2) + ' кВт</b> (Требуется: ' + (QcoldReq/1000).toFixed(2) + ' кВт)<br>' +
    '&bull; Тепло модулей: <b>' + (Qh/1000).toFixed(2) + ' кВт</b> (Требуется: ' + (QhotReq/1000).toFixed(2) + ' кВт)<br>' +
    '&bull; Потребление от БП: <b>' + (P/1000).toFixed(2) + ' кВт</b><br>' +
    '&bull; Эффективность (COP): <b>' + COP.toFixed(2) + '</b><br>' +
    '&bull; Догрев внешним ТЭНом: <b>' + Math.max(0, Qdop/1000).toFixed(2) + ' кВт</b><br>' +
    '&bull; Скорость в трубе: <b>' + v.toFixed(2) + ' м/с</b><br>' +
    '&bull; Потери давления: <b>' + dP.toFixed(1) + ' Па</b> (при давлении 12 МПа)<br>' +
    '&bull; Темп. холодной керамики: <b>' + (s.Tc - 273.15).toFixed(1) + ' &deg;C</b><br>' +
    '&bull; Длина рабочей зоны труб: <b>' + L.toFixed(2) + ' м</b>';

  const Ivec = [], COPvec = [];
  for (let j = 0; j < 100; j++) {
    const iTest = 0.5 + j * (9.0 - 0.5) / 99.0;
    const st = solveTemp(iTest, 15);
    const pel = st.qh - st.qc;
    Ivec.push(+iTest.toFixed(2));
    COPvec.push(pel > 0 ? st.qc / pel : 0);
  }

  const data = {
    datasets: [{
      label: 'Кривая КПД',
      data: Ivec.map((x, k) => ({ x, y: COPvec[k] })),
      borderColor: '#002B49', backgroundColor: 'rgba(0,43,73,.15)',
      borderWidth: 2.5, pointRadius: 0, tension: 0.25
    }, {
      label: 'Наша рабочая точка',
      data: [{ x: I, y: COP }],
      backgroundColor: '#d62728', pointRadius: 7, pointHoverRadius: 9,
      showLine: false
    }]
  };
  const opts = {
    responsive: true, maintainAspectRatio: false,
    scales: {
      x: { title: { display: true, text: 'Сила тока на модулях Пельтье I, Ампер' }, grid: { color: '#dde4ec' } },
      y: { title: { display: true, text: 'Коэффициент эффективности COP' }, grid: { color: '#dde4ec' }, beginAtZero: true }
    },
    plugins: {
      title: { display: true, text: 'Влияние силы тока на коэффициент эффективности системы (COP)', font: { weight: 'bold', size: 13 } },
      legend: { position: 'upper right' }
    }
  };
  if (chart) { chart.data = data; chart.update(); }
  else chart = new Chart(document.getElementById('chart'), { type: 'line', data, options: opts });
}

document.querySelectorAll('input[type=range]').forEach(el => el.addEventListener('input', updateModel));
updateModel();
</script>
</body>
</html>
